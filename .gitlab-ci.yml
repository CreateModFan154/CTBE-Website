image: node:22

build:
    stage: build
    before_script:
        - "yarn"
    script:
        - 'yarn run build --base "./"'
    artifacts:
        when: on_success
        access: developer
        paths:
            - "dist"
    cache:
        key:
            files:
                - yarn.lock
            prefix: yarn
        paths:
            - node_modules/

pages:
    stage: deploy
    dependencies:
        - build
    artifacts:
        when: on_success
        access: all
        paths:
            - public
    script:
        - "cp -a dist/. public/"
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

package:
    stage: deploy
    image: alpine:3
    dependencies:
        - build
    before_script:
        - "apk add --no-cache zip curl"
    script:
        - "zip -r bundle.zip dist/*"
        - 'curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file bundle.zip "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/www/${CI_COMMIT_TAG}/bundle.zip"'
    rules:
        - if: $CI_COMMIT_TAG

release:
    stage: deploy
    dependencies:
        - build
        - package
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    script:
        - "echo 'Creating release...'"
    rules:
        - if: $CI_COMMIT_TAG
    artifacts:
        expire_in: never
    release:
        tag_name: "${CI_COMMIT_TAG}"
        description: "${CI_COMMIT_TAG_MESSAGE}"
        assets:
            links:
                - name: "bundle.zip"
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/www/${CI_COMMIT_TAG}/bundle.zip"
